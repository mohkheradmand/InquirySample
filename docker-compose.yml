services:
  redis:
    image: redis:latest
    container_name: redis_server
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --loglevel warning

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis_insight
    ports:
      - "8080:5540"
    volumes:
      - redis_insight_data:/data
    restart: unless-stopped
    depends_on:
      - redis
    
volumes:
  redis_data:
  redis_insight_data: